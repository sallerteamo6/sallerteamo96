<body class="account-page">

  <header class="sub-header">
    <button class="back-btn" onclick="location.href='index.html'" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="header-title" data-i18n="acc.title">My Account</h1>
  </header>

  <section class="title-section">
    <div class="title-info">
      <h2 class="title" data-i18n="acc.cryptoWallet">Crypto Wallet</h2>
      <p class="subtitle" data-i18n="acc.manageAssets">Manage Your Digital Assets</p>
      <div class="vip-badge" id="vipBadge" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;"></div>
      <div class="member-no" id="memberNo" style="display:none;align-items:center;gap:8px;margin-top:10px;">
        <span data-i18n="acc.memberNo" style="opacity:.75;">Member No.</span>
        <strong id="memberNoValue" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;"></strong>
        <button type="button" class="member-no-copy" id="memberNoCopy" title="Copy" style="background:transparent;border:0;color:inherit;cursor:pointer;padding:0;display:inline-flex;opacity:.8;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>
    <div class="title-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="white" stroke-width="2"/><path d="M2 10h20" stroke="white" stroke-width="2"/><circle cx="17" cy="14" r="1.5" fill="white"/></svg>
    </div>
  </section>

  <section class="action-buttons">
    <button class="action-btn deposit" onclick="location.href='funds.html?t=recharge'">
      <div class="btn-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2v20m0-20l-4 4m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12H3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <span data-i18n="acc.deposit">Deposit</span>
    </button>
    <button class="action-btn withdraw" onclick="location.href='funds.html?t=withdraw'">
      <div class="btn-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 22V2m0 20l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12H3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <span data-i18n="acc.withdraw">Withdraw</span>
    </button>
    <button class="action-btn exchange" onclick="location.href='exchange.html'">
      <div class="btn-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M7 16V4m0 0L3 8m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span data-i18n="acc.exchange">Exchange</span>
    </button>
    <button class="action-btn loan" onclick="location.href='loan.html'">
      <div class="btn-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2"/></svg></div>
      <span data-i18n="acc.loan">Loan</span>
    </button>
  </section>

  <section class="wallet-section">
    <div class="section-header">
      <div class="select-line"></div>
      <h3 class="section-title" data-i18n="acc.yourWallets">Your Wallets</h3>
    </div>

    <div class="total-balance">
      <div class="total-label" data-i18n="acc.estimatedTotal">Estimated Total Value</div>
          <div class="total-value" id="balTotal">$ 0.00</div>
          <div class="total-note" id="balPriceAge"></div>
    </div>

    <div class="wallet-list" id="walletList"></div>
  </section>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    TrustApp.updateMenuUser && TrustApp.updateMenuUser();
    function setTxt(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
    function fmt(n, dec) { return (parseFloat(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }

    var COIN_NAMES = {
      USDT: 'Tether USD', USDC: 'USD Coin', TUSD: 'TrueUSD', BTC: 'Bitcoin', ETH: 'Ethereum',
      LTC: 'Litecoin', XRP: 'Ripple', DOGE: 'Dogecoin', TON: 'Toncoin', ADA: 'Cardano',
      BNB: 'BNB', SOL: 'Solana', TRX: 'TRON', UNI: 'Uniswap', AVAX: 'Avalanche',
      DOT: 'Polkadot', LINK: 'Chainlink', BCH: 'Bitcoin Cash', BSV: 'Bitcoin SV',
      IOTA: 'IOTA', ETC: 'Ethereum Classic'
    };
    var COIN_COLOR = {
      USDT: '#26a17b', BTC: '#f7931a', ETH: '#627eea', LTC: '#345d9d', XRP: '#23292f',
      DOGE: '#c2a633', TON: '#0098ea', ADA: '#0033ad', BNB: '#f3ba2f', SOL: '#14f195',
      TRX: '#ef0029', UNI: '#ff007a', AVAX: '#e84142', DOT: '#e6007a', LINK: '#2a5ada',
      BCH: '#8dc351', BSV: '#eab304', IOTA: '#101010', ETC: '#328332', USDC: '#2775ca', TUSD: '#002868'
    };
    var COIN_ORDER = ['USDT', 'BTC', 'ETH', 'XRP', 'LTC', 'USDC', 'TON', 'DOGE', 'BNB', 'ADA', 'SOL', 'TRX', 'UNI', 'AVAX', 'DOT', 'LINK', 'BCH', 'BSV', 'IOTA', 'ETC', 'TUSD'];
    var IS_CRYPTO = {};
    COIN_ORDER.forEach(function (c) { IS_CRYPTO[c] = 1; });

    // Cache for instant rendering
    var _balanceCache = null;
    // symbol -> { price, live, ageSec, fetchedAt }. Replaced wholesale by
    // loadLivePrices() so a coin the feed stopped reporting loses its live badge.
    var _priceCache = {};
    var _priceLoadedAt = 0;
    var _renderScheduled = false;

    function walletCoins(b) {
      var list = COIN_ORDER.slice();
      if (b) Object.keys(b).forEach(function (c) { if (IS_CRYPTO[c] && list.indexOf(c) === -1) list.push(c); });
      return list;
    }

    function coinIcon(c) {
      var d = TrustApp.findCoin ? TrustApp.findCoin(c) : null;
      var src = (d && d.i) ? 'img/' + d.i : 'img/' + c.toLowerCase() + '.png';
      var color = COIN_COLOR[c] || '#64748b';
      return '<div class="wallet-icon"><img src="' + src + '" alt="' + c + '" onerror="this.style.display=\'none\';this.parentNode.style.background=\'' + color + '\';this.parentNode.style.color=\'#fff\';this.parentNode.style.fontWeight=\'800\';this.parentNode.textContent=\'' + c.charAt(0) + '\';"></div>';
    }

    // ---------------------------------------------------------------------
    //  Prices are read from the server, not from the seeded market snapshot.
    //
    //  This used to take the price from TrustApp.findCoin(), which is the
    //  snapshot in the products table - a number fixed when the markets were
    //  seeded and never moved. It was also cached in _priceCache for the life of
    //  the page, so even a corrected snapshot would not have shown. Every coin
    //  looked static because every coin was static.
    //
    //  It now reads public.prices, the same table the exchange and the balance
    //  adjuster read, so one number is shown everywhere and it is the number a
    //  swap would actually use. A coin with no live price is labelled rather
    //  than quietly valued at a stale figure, because a member reading a total
    //  has no way to tell which rows are real.
    // ---------------------------------------------------------------------
    function getCachedPrice(sym) {
      var live = _priceCache[sym];
      if (live !== undefined) return live;
      var d = TrustApp.findCoin ? TrustApp.findCoin(sym) : null;
      var p = { price: d ? (parseFloat(d.price) || 0) : 0, fromFeed: false, tradable: false, ageSec: null };
      _priceCache[sym] = p;
      return p;
    }

    function loadLivePrices() {
      if (!window.DB || !DB.getExchangePrices) return Promise.resolve(false);
      return DB.getExchangePrices().then(function (map) {
        // Replace, not merge: a coin the feed has stopped reporting must lose its
        // live badge rather than keep showing the last good price as current.
        //
        // `tradable` is the server's own verdict, computed with the same
        // freshness limit exchange_coins applies. Reading a `live` flag here
        // instead is what made every coin fall back to the static snapshot: the
        // key did not exist, so every price looked like it had come from
        // somewhere else, and BTC was valued at the seeded 77,000 rather than
        // the live rate.
        _priceCache = map || {};
        _priceLoadedAt = Date.now();
        return true;
      }).catch(function () { return false; });
    }

    function refreshPrices() {
      return loadLivePrices().then(function (ok) { scheduleRender(); return ok; });
    }

    function fmtAge(sec) {
      if (sec == null) return '';
      if (sec < 60) return sec + 's ago';
      if (sec < 3600) return Math.round(sec / 60) + 'm ago';
      return Math.round(sec / 3600) + 'h ago';
    }

    function renderBalances() {
      var uid = TrustApp.getUserId();
      // Render the coin list immediately even before the session restores; zeros
      // get replaced the moment the balances table arrives (trustsync:user_balances).
      var b = uid ? (TrustApp.getBalances ? TrustApp.getBalances(uid) : {}) : {};
      _balanceCache = b;
      function usdOf(sym, bal) {
        if (sym === 'USDT') return parseFloat(bal) || 0;
        var p = getCachedPrice(sym);
        return (parseFloat(bal) || 0) * p.price;
      }
      var coins = walletCoins(b);
      var total = 0;
      var held = 0;          // value of coins the member actually holds
      var staticHeld = 0;    // of which is valued at a non-live price
      var html = coins.map(function (c) {
        var bal = parseFloat(b[c]) || 0;
        var p = getCachedPrice(c);
        var usd = usdOf(c, bal);
        total += usd;
        if (bal > 0 && c !== 'USDT') {
          held += usd;
          if (!p.fromFeed || !p.tradable) staticHeld += usd;
        }
        var dec = (c === 'BTC' || c === 'ETH') ? 4 : 2;
        // Three states, because they mean different things to a member holding
        // the money: a fresh server price, a server price the feed has stopped
        // refreshing, and no server price at all so the seeded snapshot is being
        // used. A confident dollar figure with no stated age is not something
        // anyone can act on.
        var tag = '';
        if (c !== 'USDT') {
          if (p.fromFeed && p.tradable) {
            tag = '<p class="balance-price-live">live &#183; ' + fmtAge(p.ageSec) + '</p>';
          } else if (p.fromFeed) {
            tag = '<p class="balance-price-stale">live price, ' + fmtAge(p.ageSec) + ' &#183; feed is behind</p>';
          } else if (p.price > 0) {
            tag = '<p class="balance-price-static">static price &#183; not in the live feed</p>';
          } else {
            tag = '<p class="balance-price-static">no price for this coin</p>';
          }
        }
        return '<div class="wallet-item' + (c === 'USDT' ? ' main-wallet' : '') + '" onclick="location.href=\'funds.html?t=recharge\'">'
          + '<div class="wallet-info">' + coinIcon(c)
          + '<div class="wallet-details"><h4 class="coin-name">' + c + '</h4>'
          + '<p class="coin-subtitle">' + (COIN_NAMES[c] || (c + ' Coin')) + '</p></div></div>'
          + '<div class="wallet-balance">'
          + '<p class="balance-usd">' + (usd > 0 || c === 'USDT' ? '$ ' + fmt(usd, 2) : '--') + '</p>'
          + '<p class="balance-coin">' + fmt(bal, dec) + ' ' + c + '</p>'
          + tag
          + '</div></div>';
      }).join('');
      var listEl = document.getElementById('walletList');
      if (listEl) listEl.innerHTML = html;
      setTxt('balTotal', '$ ' + fmt(total, 2));

      // Say how fresh the figures are, and how much of the total is not live.
      // A member cannot act on a total they do not know the age of.
      var age = document.getElementById('balPriceAge');
      if (age) {
        var newest = 0, anyFeed = false;
        for (var k in _priceCache) {
          var q = _priceCache[k];
          if (q && q.fromFeed) { anyFeed = true; if (q.ageSec > newest) newest = q.ageSec; }
        }
        var bits = [];
        if (anyFeed) bits.push(newest ? 'live prices updated ' + fmtAge(newest) : 'live prices loaded');
        else bits.push('no live prices - start scripts/prices.mjs');
        if (staticHeld > 0) bits.push('includes $' + fmt(staticHeld, 2) + ' not at a live price');
        age.textContent = bits.join(' · ');
        age.className = 'total-note' + (staticHeld > 0 ? ' total-note-warn' : '');
      }
      var vb = document.getElementById('vipBadge');
      if (vb && TrustApp.guessVip && uid) {
        var v = TrustApp.guessVip(uid);
        vb.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:' + v.color + '1a;color:' + v.color + ';font-weight:700;font-size:12.5px;border:1px solid ' + v.color + '55;">'
          + '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + v.color + '"><path d="M12 15l-5.5 3 1.5-6L2.5 7l6-.5L12 1l3.5 5.5 6 .5-5.5 5 1.5 6z"/></svg>'
          + v.label + '</span>';
      }
      renderMemberNo();
    }

    // Six-digit member number, assigned by the prepare_user() trigger on
    // signup. Hidden until the row has actually loaded, so it never renders as
    // an empty or placeholder value.
    var _memberNoShown = false;
    function renderMemberNo() {
      var wrap = document.getElementById('memberNo');
      var val = document.getElementById('memberNoValue');
      if (!wrap || !val || _memberNoShown) return;
      var u = TrustApp.currentUser ? TrustApp.currentUser() : null;
      var code = u && (u.uid_code || u.uidCode);
      if (!code) return;
      _memberNoShown = true;
      val.textContent = code;
      wrap.style.display = 'inline-flex';
      var copy = document.getElementById('memberNoCopy');
      if (copy) copy.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () {
            if (TrustApp.toast) TrustApp.toast('ok', 'Copied');
          }).catch(function () {});
        }
      };
    }

    function scheduleRender() {
      if (_renderScheduled) return;
      _renderScheduled = true;
      requestAnimationFrame(function () {
        _renderScheduled = false;
        renderBalances();
      });
    }

    // Instant initial render from cache if available
    if (TrustApp.getBalances) {
      var uid = TrustApp.getUserId();
      if (uid) {
        var b = TrustApp.getBalances(uid);
        if (b && Object.keys(b).length) {
          _balanceCache = b;
          renderBalances();
        }
      }
    }

    // Live prices, and re-read on a timer. Deliberately at top level, not inside
    // the block above: TrustApp.getUserId() is null until the async session
    // restore resolves, so anything placed in there does not run on a normal
    // first paint - which is exactly where the prices were being fetched from,
    // and why every coin showed a static figure until something else forced a
    // repaint. Prices do not depend on being signed in, so they are not gated on
    // the session.
    //
    // Thirty seconds: the exchange holds a price to five minutes, so this keeps
    // the figure well inside the same window and visibly moving, and the age is
    // displayed either way.
    refreshPrices();
    setInterval(refreshPrices, 30000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshPrices();
    });

    renderBalances();

    // re-render once the async session restore resolves (uid is unknown until
    // then) and again when the DB finishes loading its tables.
    if (TrustApp.restoreSession) TrustApp.restoreSession().then(scheduleRender);
    if (window.DB && DB.onReady) DB.onReady(scheduleRender);

    // Real-time updates via trustsync
    window.addEventListener('trustsync:user_balances', scheduleRender);
    window.addEventListener('trustsync:transactions', scheduleRender);
    window.addEventListener('trustsync:users', scheduleRender);

    // Fallback polling
    window.addEventListener('storage', function (e) {
      if (e.key === 'trustBalances' || e.key === null) scheduleRender();
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) scheduleRender();
    });
    setInterval(scheduleRender, 10000);
  </script>
</body>
</html>
