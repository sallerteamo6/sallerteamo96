<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <title>Trust</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/config.js?v=20260926c"></script>
  <script src="scripts/supabase-client.js?v=20260926c"></script>
    <script src="scripts/db.js?v=20260926c"></script>
  <script src="app.js?v=20260926c"></script>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="login-top-left">
        <button class="wallet-connect-btn" id="walletBtn" onclick="TrustApp.connectWallet()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M6 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><circle cx="16" cy="13" r="1" fill="currentColor"></circle></svg>
          <span id="walletText" data-i18n="common.connectWallet">Connect Wallet</span>
        </button>
      </div>
      <div class="login-wrapper">
        <div class="language-selector">
          <div class="language-toggle" onclick="toggleLang()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </div>
          <div class="language-menu" id="langMenu" style="display:none;">
            <div class="language-option active" onclick="setLang(this,'English')">English</div>
            <div class="language-option" onclick="setLang(this,'中文')">中文</div>
            <div class="language-option" onclick="setLang(this,'日本語')">日本語</div>
            <div class="language-option" onclick="setLang(this,'한국어')">한국어</div>
            <div class="language-option" onclick="setLang(this,'فارسی')">فارسی</div>
            <div class="language-option" onclick="setLang(this,'Deutsch')">Deutsch</div>
            <div class="language-option" onclick="setLang(this,'Français')">Français</div>
            <div class="language-option" onclick="setLang(this,'Español')">Español</div>
            <div class="language-option" onclick="setLang(this,'Italiano')">Italiano</div>
            <div class="language-option" onclick="setLang(this,'Português')">Português</div>
            <div class="language-option" onclick="setLang(this,'Русский')">Русский</div>
          </div>
        </div>
        <div>
          <div class="logo"><img src="img/logo.png" alt="Logo" class="logo-image"></div>
          <form class="login-form" onsubmit="return doLogin(event)">
            <div class="input-group"><input type="text" placeholder="Phone/Email" class="input-field" id="username" data-i18n-ph="login.phoneEmail" required></div>
            <div class="input-group"><input type="password" placeholder="Password" class="input-field" id="password" data-i18n-ph="login.password" required></div>
            <div class="remember-me"><input type="checkbox" id="remember" class="checkbox"><label for="remember" class="checkbox-label" data-i18n="login.remember">Remember me</label></div>
            <button type="submit" class="login-button" id="loginBtn" data-i18n="login.login">Login</button>
            <div class="auth-msg" id="authMsg"></div>
            <div class="backend-state" id="backendState"><span class="dot"></span><span id="backendText">Checking backend...</span></div>
            <div class="backend-diag" id="backendDiag"></div>
            <div class="links">
              <a href="register.html" class="link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                <span data-i18n="login.register">Register</span>
              </a>
              <a href="javascript:void(0);" class="link" onclick="location.href='service.html'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span data-i18n="common.onlineService">Online Service</span>
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var fields = document.querySelectorAll('.login-form .input-field');
    var btn = document.getElementById('loginBtn');
    function updateBtn() {
      var empty = !fields[0].value || !fields[1].value;
      btn.disabled = empty;
      btn.classList.toggle('disabled', empty);
    }
    fields.forEach(function (f) { f.addEventListener('input', updateBtn); });
    updateBtn();

    function getParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    // ---------------------------------------------------------------
    //  Persistent status line.
    //  A 2.5s toast disappears before a slow failure can be read, and a
    //  frozen button explains nothing. This stays until the next attempt.
    // ---------------------------------------------------------------
    function say(kind, text, retryLabel) {
      var box = document.getElementById('authMsg');
      if (!box) return;
      box.className = 'auth-msg' + (kind ? ' on auth-msg-' + kind : '');
      box.textContent = '';
      if (!text) return;
      box.appendChild(document.createTextNode(text));
      if (retryLabel) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'auth-retry';
        b.textContent = retryLabel;
        b.onclick = function () { say('', ''); doLogin({ preventDefault: function () {} }); };
        box.appendChild(b);
      }
    }

    // Run an auth call so that it can NEVER leave the button disabled.
    // Catches a synchronous throw, a rejected promise, and a call that simply
    // never settles -- the last one is what produced the permanent
    // "Loading..." state.
    function runAuth(fn, ms, label) {
      return new Promise(function (resolve) {
        var settled = false;
        function finish(v) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(v);
        }
        var timer = setTimeout(function () {
          finish({ ok: false, msg: label + ' timed out after ' + (ms / 1000) +
            's. The server did not respond. It is still running, so please wait a moment and try again.' });
        }, ms);
        var p;
        try { p = fn(); } catch (e) { return finish({ ok: false, msg: (e && e.message) || (label + ' failed') }); }
        Promise.resolve(p).then(finish, function (e) {
          finish({ ok: false, msg: (e && e.message) || (label + ' failed') });
        });
      });
    }

    function doLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      var user = fields[0].value;
      var pass = fields[1].value;
      say('', '');
      btn.disabled = true; btn.textContent = 'Signing in...';
      return runAuth(function () { return TrustApp.login(user, pass); }, 40000, 'Sign-in')
        .then(function (res) {
          if (!res || !res.ok) {
            btn.disabled = false; btn.textContent = 'Login'; updateBtn();
            say('error', (res && res.msg) || 'Login failed', 'Try again');
            return false;
          }
          btn.textContent = 'Signed in';
          say('ok', 'Signed in. Redirecting...');
          var r = getParam('r');
          setTimeout(function () { location.href = r || 'index.html'; }, 400);
          return false;
        });
    }

    // ---------------------------------------------------------------
    //  Backend readout. Turns "stuck on Loading" into a readable state and
    //  proves which build the browser actually loaded, so a stale cached
    //  db.js is never mistaken for an unfixed bug.
    // ---------------------------------------------------------------
    (function backendReadout() {
      var wrap = document.getElementById('backendState');
      var text = document.getElementById('backendText');
      var diag = document.getElementById('backendDiag');
      if (!wrap || !text || typeof DB === 'undefined') return;
      var tries = 0;
      function paint() {
        var v = DB.VERSION || '?';
        if (DB.connected) {
          wrap.className = 'backend-state ok';
          text.innerHTML = 'Backend connected &middot; build <b>' + v + '</b>';
        } else if (tries > 24) {
          wrap.className = 'backend-state bad';
          text.innerHTML = 'Backend NOT connected &middot; build <b>' + v + '</b> &middot; ' +
            '<a href="#" id="showDiag">details</a>';
          var a = document.getElementById('showDiag');
          if (a) a.onclick = function (ev) {
            ev.preventDefault();
            paintDiag();
            return false;
          };
        } else {
          wrap.className = 'backend-state wait';
          text.innerHTML = 'Connecting to backend... &middot; build <b>' + v + '</b>';
        }
        tries++;
      }
      function paintDiag() {
        var lines = [];
        try { lines = DB.diag(); } catch (e) { lines = ['diag unavailable: ' + e.message]; }
        diag.className = 'backend-diag on';
        diag.textContent = lines.length ? lines.join('\n') : '(no diagnostics recorded)';
      }
      paint();
      var iv = setInterval(function () {
        paint();
        if (DB.connected || tries > 24) clearInterval(iv);
      }, 1000);
      wrap.onclick = function () { if (diag.className.indexOf('on') === -1) paintDiag(); };
    })();

    try {
      document.getElementById('remember').checked = false;
    } catch (err) {}
    if (TrustApp.applyWalletBtn) TrustApp.applyWalletBtn();
  </script>
</body>
</html>
