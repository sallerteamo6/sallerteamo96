<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <title>Trust</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-auth.css?v=20260927-wallet7">
  <script src="scripts/config.js?v=20260927-wallet7"></script>
  <script src="scripts/supabase-client.js?v=20260926m"></script>
  <script src="scripts/db.js?v=20260927-wallet7"></script>
  <script src="app.js?v=20260927-wallet7"></script>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="login-wrapper">
        <!-- Language picker: circular globe toggle, menu drops below it. -->
        <div class="language-selector">
          <button type="button" class="language-toggle" onclick="toggleLang()" aria-label="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </button>
          <div class="language-menu" id="langMenu" style="display:none;">
            <div class="language-option" onclick="setLang(this, 'English')">English</div>
            <div class="language-option" onclick="setLang(this, '中文')">中文</div>
            <div class="language-option" onclick="setLang(this, '日本語')">日本語</div>
            <div class="language-option" onclick="setLang(this, '한국어')">한국어</div>
            <div class="language-option" onclick="setLang(this, 'فارسی')">فارسی</div>
            <div class="language-option" onclick="setLang(this, 'Deutsch')">Deutsch</div>
            <div class="language-option" onclick="setLang(this, 'Français')">Français</div>
            <div class="language-option" onclick="setLang(this, 'Español')">Español</div>
            <div class="language-option" onclick="setLang(this, 'Italiano')">Italiano</div>
            <div class="language-option" onclick="setLang(this, 'Português')">Português</div>
            <div class="language-option" onclick="setLang(this, 'Русский')">Русский</div>
          </div>
        </div>

        <div>
          <div class="logo"><img src="img/logo.png" alt="Logo" class="logo-image"></div>

          <!-- ---------------- password mode ---------------- -->
          <form class="login-form" id="pwForm" onsubmit="return doLogin(event)">
            <div class="input-group">
              <input type="text" placeholder="Phone/Email" class="input-field" id="username" data-i18n-ph="login.phoneEmail" autocomplete="username" required>
            </div>
            <div class="input-group">
              <input type="password" placeholder="Password" class="input-field" id="password" data-i18n-ph="login.password" autocomplete="current-password" required>
            </div>
            <div class="remember-me">
              <input type="checkbox" id="remember" class="checkbox">
              <label for="remember" class="checkbox-label" data-i18n="login.remember">Remember me</label>
            </div>
            <button type="submit" class="login-button" id="loginBtn" data-i18n="login.login">Login</button>
            <div class="auth-msg" id="authMsg"></div>
          </form>

          <!-- ---------------- wallet sign-in ----------------
               One button, one click. It used to be a mode switch: the first
               click swapped the whole form for a second screen carrying another
               Connect Wallet button, so reaching the wallet took two clicks and
               an extra page with a "Login" link back. Connecting and signing in
               are a single action, so it is a single button here, and the
               password form stays on screen instead of being swapped out. -->
          <div class="auth-divider"><span>or</span></div>

          <button type="button" class="wallet-cta" id="walletConnectBtn" onclick="doWalletLogin()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M6 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><circle cx="16" cy="13" r="1" fill="currentColor"></circle></svg>
            <span id="walletCtaText" data-i18n="common.connectWallet">Connect Wallet</span>
          </button>

          <div class="auth-msg" id="walletMsg"></div>
          <p class="wallet-hint" data-i18n="login.walletHint">Sign in with your wallet. No password needed.</p>

          <!-- Secondary links sit below both sign-in methods, not between them.
               They were inside the form, which put a bordered row carrying
               Register / Online Service above the wallet button and made the two
               ways of signing in look unrelated. -->
          <div class="links">
            <a href="register.html" class="link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
              <span data-i18n="login.register">Register</span>
            </a>
            <a href="javascript:void(0);" class="link" onclick="location.href='service.html'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span data-i18n="common.onlineService">Online Service</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var fields = document.querySelectorAll('#pwForm .input-field');
    var btn = document.getElementById('loginBtn');

    // The top-left chip used to be a mode switch: one click replaced the form
    // with a second screen holding another Connect Wallet button. There is no
    // mode any more. doWalletLogin below is the only entry point, and the button
    // in the card calls it directly.
    var walletAttempt = null;
    function doWalletLogin() {
      if (walletAttempt) return walletAttempt;
      // Only the wallet's own line is cleared. Clearing the password form's
      // message would wipe an unrelated sign-in error the member is reading.
      sayWallet('', '');
      var wbtn = document.getElementById('walletConnectBtn');
      var wtxt = document.getElementById('walletCtaText');
      var idle = wtxt ? wtxt.textContent : 'Connect Wallet';
      if (wbtn) wbtn.disabled = true;
      if (wtxt) wtxt.textContent = 'Connecting...';
      // connectWallet includes sign-in. Polling getWallet() and calling
      // walletLogin again replaced the first nonce while the user was signing.
      // ownFeedback: this page draws the outcome in walletMsg below the button,
      // so connectWallet must not also toast the same sentence.
      walletAttempt = Promise.resolve().then(function () {
        return TrustApp.connectWallet({ redirect: false, ownFeedback: true, onStatus: function (text) {
          if (wtxt) wtxt.textContent = text;
          sayWallet('warn', text);
        } });
      }).then(function (res) {
        if (!res || !res.ok) {
          sayWallet('error', (res && res.msg) || 'Wallet sign-in failed', 'Try again', doWalletLogin);
          return false;
        }
        sayWallet('ok', 'Signed in. Redirecting...');
        setTimeout(function () { location.href = TrustApp.walletReturnUrl(); }, 400);
        return true;
      }).catch(function (e) {
        sayWallet('error', (e && e.message) || 'Wallet sign-in failed', 'Try again', doWalletLogin);
        return false;
      }).then(function (ok) {
        walletAttempt = null;
        if (wbtn) wbtn.disabled = false;
        if (wtxt) wtxt.textContent = ok ? 'Signed in' : idle;
        if (wbtn) wbtn.classList.toggle('connected', !!ok);
        return ok;
      });
      return walletAttempt;
    }

    function updateBtn() {
      var empty = !fields[0].value || !fields[1].value;
      btn.disabled = empty;
      btn.classList.toggle('disabled', empty);
    }
    fields.forEach(function (f) { f.addEventListener('input', updateBtn); });
    updateBtn();

    function getParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    // ---------------------------------------------------------------
    //  Persistent status lines. A 2.5s toast disappears before a slow
    //  failure can be read, and a frozen button explains nothing. These
    //  stay until the next attempt.
    //
    //  The password form and the wallet button each get their own line. They
    //  used to share one, which meant a wallet failure wiped a sign-in error
    //  out from under the member, and vice versa.
    // ---------------------------------------------------------------
    function sayInto(box, kind, text, retryLabel, retryAction) {
      if (!box) return;
      box.className = 'auth-msg' + (kind ? ' on auth-msg-' + kind : '');
      box.textContent = '';
      if (!text) return;
      box.appendChild(document.createTextNode(text));
      if (retryLabel) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'auth-retry';
        b.textContent = retryLabel;
        b.onclick = function () { box.textContent = ''; if (retryAction) retryAction(); else doLogin({ preventDefault: function () {} }); };
        box.appendChild(b);
      }
    }
    function say(kind, text, retryLabel, retryAction) {
      sayInto(document.getElementById('authMsg'), kind, text, retryLabel, retryAction);
    }
    function sayWallet(kind, text, retryLabel, retryAction) {
      sayInto(document.getElementById('walletMsg'), kind, text, retryLabel, retryAction);
    }

    // Run an auth call so that it can NEVER leave the button disabled.
    // Catches a synchronous throw, a rejected promise, and a call that simply
    // never settles -- the last one is what produced the permanent
    // "Loading..." state.
    function runAuth(fn, ms, label) {
      return new Promise(function (resolve) {
        var settled = false;
        function finish(v) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(v);
        }
        var timer = setTimeout(function () {
          finish({ ok: false, msg: label + ' timed out after ' + (ms / 1000) +
            's. The server did not respond. It is still running, so please wait a moment and try again.' });
        }, ms);
        var p;
        try { p = fn(); } catch (e) { return finish({ ok: false, msg: (e && e.message) || (label + ' failed') }); }
        Promise.resolve(p).then(finish, function (e) {
          finish({ ok: false, msg: (e && e.message) || (label + ' failed') });
        });
      });
    }

    function doLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      var user = fields[0].value;
      var pass = fields[1].value;
      say('', '');
      btn.disabled = true; btn.textContent = 'Signing in...';
      return runAuth(function () { return TrustApp.login(user, pass); }, 40000, 'Sign-in')
        .then(function (res) {
          if (!res || !res.ok) {
            btn.disabled = false; btn.textContent = 'Login'; updateBtn();
            say('error', (res && res.msg) || 'Login failed', 'Try again');
            return false;
          }
          if (res.needsEmailConfirm) { say('warn', res.message || 'Check your email to confirm the account, then sign in.'); btn.disabled = false; btn.textContent = 'Login'; updateBtn(); return false; }
          btn.textContent = 'Signed in';
          say('ok', 'Signed in. Redirecting...');
          var r = getParam('r');
          setTimeout(function () { location.href = r || 'index.html'; }, 400);
          return false;
        });
    }

    // ---------------------------------------------------------------
    //  Startup check. The always-on status line this replaced hid the one
    //  thing that matters: if the Supabase client never loaded, sign-in
    //  could only fail after ~25s with a misleading "Database not
    //  configured". Say so once, up front, and only when it is broken.
    //  DB.diag() is still available in the console for the detail.
    // ---------------------------------------------------------------
    (function startupCheck() {
      var wait = function (p) { return (p && p.then) ? p : Promise.resolve(p); };
      var done = false;
      var fail = function (msg) {
        if (done) return;
        done = true;
        say('error', msg);
      };
      var settle = function () {
        if (done) return;
        if (typeof DB === 'undefined') { fail('Backend failed to load. Reload the page.'); return; }
        // The client is up. A failed table load is not fatal to sign-in, so
        // only the client failing counts as fatal here.
        done = true;
      };
      try {
        if (window.__supabaseError) { fail('Could not reach the server. Check your connection and reload.'); return; }
        if (window.__supabaseReady) { wait(window.__supabaseReady).then(settle); return; }
        settle();
      } catch (e) {
        fail('Backend failed to start: ' + (e && e.message));
      }
    })();

    // Remember-me: fill the saved account and pre-tick the box. The original
    // persisted the password too; we deliberately do not.
    (function restoreRemember() {
      try {
        var u = localStorage.getItem('savedUsername') || '';
        if (u) { fields[0].value = u; }
        document.getElementById('remember').checked = !!u;
        updateBtn();
      } catch (err) {}
      document.getElementById('remember').addEventListener('change', function (e) {
        try {
          if (e.target.checked) localStorage.setItem('savedUsername', fields[0].value);
          else localStorage.removeItem('savedUsername');
        } catch (err) {}
      });
    })();

    if (TrustApp.applyWalletBtn) TrustApp.applyWalletBtn();

    // The removed top-left chip used to show the connected address here, via
    // applyWalletBtn. Keep that affordance on the button that replaced it, so a
    // member who already connected this wallet can see which one it is.
    (function reflectConnectedWallet() {
      var w = TrustApp.getWallet && TrustApp.getWallet();
      if (!w || !w.address) return;
      var txt = document.getElementById('walletCtaText');
      var btn = document.getElementById('walletConnectBtn');
      if (txt) txt.textContent = w.address.slice(0, 6) + '...' + w.address.slice(-4);
      if (btn) btn.classList.add('connected');
    })();

    if (typeof applyI18n === 'function') applyI18n();
  </script>
</body>
</html>
