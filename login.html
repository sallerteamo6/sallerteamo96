<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <title>Trust</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-auth.css">
  <script src="scripts/config.js?v=20260926m"></script>
  <script src="scripts/supabase-client.js?v=20260926m"></script>
  <script src="scripts/db.js?v=20260926q"></script>
  <script src="app.js?v=20260926q"></script>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <!-- Top-left wallet affordance. Doubles as the password <-> wallet mode switch. -->
      <div class="login-top-left">
        <button class="wallet-connect-btn" id="walletBtn" onclick="onWalletBtn()" style="display:flex;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"></rect><path d="M6 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><circle cx="16" cy="13" r="1" fill="currentColor"></circle></svg>
          <span id="walletText" data-i18n="common.connectWallet">Connect Wallet</span>
        </button>
      </div>

      <div class="login-wrapper">
        <!-- Language picker: circular globe toggle, menu drops below it. -->
        <div class="language-selector">
          <button type="button" class="language-toggle" onclick="toggleLang()" aria-label="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </button>
          <div class="language-menu" id="langMenu" style="display:none;">
            <div class="language-option" onclick="setLang(this, 'English')">English</div>
            <div class="language-option" onclick="setLang(this, '中文')">中文</div>
            <div class="language-option" onclick="setLang(this, '日本語')">日本語</div>
            <div class="language-option" onclick="setLang(this, '한국어')">한국어</div>
            <div class="language-option" onclick="setLang(this, 'فارسی')">فارسی</div>
            <div class="language-option" onclick="setLang(this, 'Deutsch')">Deutsch</div>
            <div class="language-option" onclick="setLang(this, 'Français')">Français</div>
            <div class="language-option" onclick="setLang(this, 'Español')">Español</div>
            <div class="language-option" onclick="setLang(this, 'Italiano')">Italiano</div>
            <div class="language-option" onclick="setLang(this, 'Português')">Português</div>
            <div class="language-option" onclick="setLang(this, 'Русский')">Русский</div>
          </div>
        </div>

        <div>
          <div class="logo"><img src="img/logo.png" alt="Logo" class="logo-image"></div>

          <!-- ---------------- password mode ---------------- -->
          <form class="login-form" id="pwForm" onsubmit="return doLogin(event)">
            <div class="input-group">
              <input type="text" placeholder="Phone/Email" class="input-field" id="username" data-i18n-ph="login.phoneEmail" autocomplete="username" required>
            </div>
            <div class="input-group">
              <input type="password" placeholder="Password" class="input-field" id="password" data-i18n-ph="login.password" autocomplete="current-password" required>
            </div>
            <div class="remember-me">
              <input type="checkbox" id="remember" class="checkbox">
              <label for="remember" class="checkbox-label" data-i18n="login.remember">Remember me</label>
            </div>
            <button type="submit" class="login-button" id="loginBtn" data-i18n="login.login">Login</button>
            <div class="auth-msg" id="authMsg"></div>
            <div class="links">
              <a href="register.html" class="link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                <span data-i18n="login.register">Register</span>
              </a>
              <a href="javascript:void(0);" class="link" onclick="location.href='service.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span data-i18n="common.onlineService">Online Service</span>
              </a>
            </div>
          </form>

          <!-- ---------------- wallet mode ---------------- -->
          <div class="wallet-login-mode" id="walletMode" style="display:none;">
            <button type="button" class="login-button" id="walletConnectBtn" onclick="doWalletLogin()" data-i18n="common.connectWallet">Connect Wallet</button>
            <a href="javascript:void(0);" class="link" onclick="showPwMode()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
              <span data-i18n="login.login">Login</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    var fields = document.querySelectorAll('#pwForm .input-field');
    var btn = document.getElementById('loginBtn');

    // The top-left button opens wallet mode on first click; once a wallet is
    // already connected it retries the handshake instead of re-toggling.
    var walletModeShown = false;
    function onWalletBtn() {
      if (walletModeShown) { doWalletLogin(); return; }
      showWalletMode();
    }

    function showWalletMode() {
      walletModeShown = true;
      document.getElementById('pwForm').style.display = 'none';
      var wm = document.getElementById('walletMode');
      wm.style.display = 'flex';
      var top = document.getElementById('walletBtn');
      if (top) top.style.display = 'none';
    }

    function showPwMode() {
      walletModeShown = false;
      document.getElementById('pwForm').style.display = '';
      var wm = document.getElementById('walletMode');
      wm.style.display = 'none';
      var top = document.getElementById('walletBtn');
      if (top) top.style.display = 'flex';
    }

    // connectWallet() is fire-and-forget: it shows its own toasts and stashes
    // the address in _wallet. walletLogin() is the separate step that turns
    // that address into a session, and it needs the address passed in. So we
    // drive the handshake, then poll for the address before signing in.
    function doWalletLogin() {
      say('', '');
      var wbtn = document.getElementById('walletConnectBtn');
      if (wbtn) { wbtn.disabled = true; wbtn.textContent = 'Connecting...'; }
      try { TrustApp.connectWallet(); } catch (e) { /* reported below via poll */ }

      var deadline = Date.now() + 90000;
      var iv = setInterval(function () {
        var w = null;
        try { w = TrustApp.getWallet(); } catch (e) {}
        if (w && w.address) {
          clearInterval(iv);
          if (wbtn) { wbtn.disabled = false; wbtn.textContent = 'Connect Wallet'; }
          runAuth(function () { return TrustApp.walletLogin(w.address); }, 40000, 'Wallet sign-in')
            .then(function (res) {
              if (!res || !res.ok) { say('error', (res && res.msg) || 'Wallet sign-in failed', 'Try again'); return false; }
              say('ok', 'Signed in. Redirecting...');
              setTimeout(function () { location.href = getParam('r') || 'index.html'; }, 400);
              return false;
            });
          return;
        }
        if (Date.now() > deadline) {
          clearInterval(iv);
          if (wbtn) { wbtn.disabled = false; wbtn.textContent = 'Connect Wallet'; }
          say('error', 'No wallet detected. Install a browser wallet extension, then try again.', 'Try again');
        }
      }, 400);
    }

    function updateBtn() {
      var empty = !fields[0].value || !fields[1].value;
      btn.disabled = empty;
      btn.classList.toggle('disabled', empty);
    }
    fields.forEach(function (f) { f.addEventListener('input', updateBtn); });
    updateBtn();

    function getParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    // ---------------------------------------------------------------
    //  Persistent status line. A 2.5s toast disappears before a slow
    //  failure can be read, and a frozen button explains nothing. This
    //  stays until the next attempt.
    // ---------------------------------------------------------------
    function say(kind, text, retryLabel) {
      var box = document.getElementById('authMsg');
      if (!box) return;
      box.className = 'auth-msg' + (kind ? ' on auth-msg-' + kind : '');
      box.textContent = '';
      if (!text) return;
      box.appendChild(document.createTextNode(text));
      if (retryLabel) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'auth-retry';
        b.textContent = retryLabel;
        b.onclick = function () { say('', ''); doLogin({ preventDefault: function () {} }); };
        box.appendChild(b);
      }
    }

    // Run an auth call so that it can NEVER leave the button disabled.
    // Catches a synchronous throw, a rejected promise, and a call that simply
    // never settles -- the last one is what produced the permanent
    // "Loading..." state.
    function runAuth(fn, ms, label) {
      return new Promise(function (resolve) {
        var settled = false;
        function finish(v) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(v);
        }
        var timer = setTimeout(function () {
          finish({ ok: false, msg: label + ' timed out after ' + (ms / 1000) +
            's. The server did not respond. It is still running, so please wait a moment and try again.' });
        }, ms);
        var p;
        try { p = fn(); } catch (e) { return finish({ ok: false, msg: (e && e.message) || (label + ' failed') }); }
        Promise.resolve(p).then(finish, function (e) {
          finish({ ok: false, msg: (e && e.message) || (label + ' failed') });
        });
      });
    }

    function doLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      var user = fields[0].value;
      var pass = fields[1].value;
      say('', '');
      btn.disabled = true; btn.textContent = 'Signing in...';
      return runAuth(function () { return TrustApp.login(user, pass); }, 40000, 'Sign-in')
        .then(function (res) {
          if (!res || !res.ok) {
            btn.disabled = false; btn.textContent = 'Login'; updateBtn();
            say('error', (res && res.msg) || 'Login failed', 'Try again');
            return false;
          }
          if (res.needsEmailConfirm) { say('warn', res.message || 'Check your email to confirm the account, then sign in.'); btn.disabled = false; btn.textContent = 'Login'; updateBtn(); return false; }
          btn.textContent = 'Signed in';
          say('ok', 'Signed in. Redirecting...');
          var r = getParam('r');
          setTimeout(function () { location.href = r || 'index.html'; }, 400);
          return false;
        });
    }

    // ---------------------------------------------------------------
    //  Startup check. The always-on status line this replaced hid the one
    //  thing that matters: if the Supabase client never loaded, sign-in
    //  could only fail after ~25s with a misleading "Database not
    //  configured". Say so once, up front, and only when it is broken.
    //  DB.diag() is still available in the console for the detail.
    // ---------------------------------------------------------------
    (function startupCheck() {
      var wait = function (p) { return (p && p.then) ? p : Promise.resolve(p); };
      var done = false;
      var fail = function (msg) {
        if (done) return;
        done = true;
        say('error', msg);
      };
      var settle = function () {
        if (done) return;
        if (typeof DB === 'undefined') { fail('Backend failed to load. Reload the page.'); return; }
        // The client is up. A failed table load is not fatal to sign-in, so
        // only the client failing counts as fatal here.
        done = true;
      };
      try {
        if (window.__supabaseError) { fail('Could not reach the server. Check your connection and reload.'); return; }
        if (window.__supabaseReady) { wait(window.__supabaseReady).then(settle); return; }
        settle();
      } catch (e) {
        fail('Backend failed to start: ' + (e && e.message));
      }
    })();

    // Remember-me: fill the saved account and pre-tick the box. The original
    // persisted the password too; we deliberately do not.
    (function restoreRemember() {
      try {
        var u = localStorage.getItem('savedUsername') || '';
        if (u) { fields[0].value = u; }
        document.getElementById('remember').checked = !!u;
        updateBtn();
      } catch (err) {}
      document.getElementById('remember').addEventListener('change', function (e) {
        try {
          if (e.target.checked) localStorage.setItem('savedUsername', fields[0].value);
          else localStorage.removeItem('savedUsername');
        } catch (err) {}
      });
    })();

    if (TrustApp.applyWalletBtn) TrustApp.applyWalletBtn();
    if (typeof applyI18n === 'function') applyI18n();
  </script>
</body>
</html>
