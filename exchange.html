<body class="auth-page exchange-page" style="background:#f5f7fa;">

  <header class="sub-header">
    <button class="back-btn" onclick="location.href='account.html'" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="header-title" data-i18n="exch.title">Exchange</h1>
  </header>

  <main class="page" style="max-width:560px;">
    <div class="exchange-form">
      <div>
        <label class="form-label" data-i18n="exch.from">From</label>
        <div class="exchange-row">
          <select class="currency-select" id="fromCoin">
            <option value="USDT" data-rate="1">USDT</option>
            <option value="BTC" data-rate="67482.5">BTC</option>
            <option value="ETH" data-rate="3512.18">ETH</option>
            <option value="LTC" data-rate="84.12">LTC</option>
            <option value="XRP" data-rate="2.24">XRP</option>
            <option value="DOGE" data-rate="0.158">DOGE</option>
            <option value="TON" data-rate="5.42">TON</option>
            <option value="ADA" data-rate="0.71">ADA</option>
            <option value="BNB" data-rate="685.3">BNB</option>
            <option value="TRX" data-rate="0.27">TRX</option>
            <option value="UNI" data-rate="9.84">UNI</option>
            <option value="AVAX" data-rate="27.51">AVAX</option>
            <option value="USDC" data-rate="1">USDC</option>
          </select>
          <input type="number" class="amount-input" id="fromAmount" data-i18n-ph="exch.enterAmount" placeholder="Please enter amount">
        </div>
        <div class="balance-line"><span data-i18n="exch.available">Available Balance</span>: <span id="fromBal">1,025.00</span> USDT <button class="all-btn" data-i18n="exch.all" onclick="setMax()">ALL</button></div>
      </div>

      <div class="exchange-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10L12 15L17 10"/></svg>
      </div>

      <div>
        <label class="form-label" data-i18n="exch.to">To</label>
        <div class="exchange-row">
          <select class="currency-select" id="toCoin">
            <option value="BTC" data-rate="67482.5">BTC</option>
            <option value="USDT" data-rate="1" selected>USDT</option>
            <option value="ETH" data-rate="3512.18">ETH</option>
            <option value="LTC" data-rate="84.12">LTC</option>
            <option value="XRP" data-rate="2.24">XRP</option>
            <option value="DOGE" data-rate="0.158">DOGE</option>
            <option value="TON" data-rate="5.42">TON</option>
            <option value="ADA" data-rate="0.71">ADA</option>
            <option value="BNB" data-rate="685.3">BNB</option>
            <option value="TRX" data-rate="0.27">TRX</option>
            <option value="UNI" data-rate="9.84">UNI</option>
            <option value="AVAX" data-rate="27.51">AVAX</option>
            <option value="USDC" data-rate="1">USDC</option>
          </select>
          <input type="number" class="amount-input readonly" id="toAmount" data-i18n-ph="exch.calculating" placeholder="Calculating..." readonly>
        </div>
        <div class="balance-line"><span data-i18n="exch.available">Available Balance</span>: <span id="toBal">0.0000</span> <span id="toBalCoin">BTC</span></div>
      </div>

      <div class="exchange-rate" id="rateLine">Exchange Rate: 1 USDT = 1.0000 USDT</div>
      <div class="exchange-rate" style="border-top:none;padding-top:0;"><span data-i18n="exch.estimatedFee">Estimated fee</span>: 0.10%</div>

      <button class="exchange-btn" data-i18n="exch.now" onclick="doExchange()">Exchange Now</button>
    </div>

    <div class="exchange-history">
      <h3 class="section-title" style="margin-bottom:12px;" data-i18n="exch.history">Exchange History</h3>
      <div id="histList">
        <div class="record-item">
          <div><span class="exchange-pair">USDT</span><svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19M19 12L12 5M19 12L12 19"/></svg><span class="exchange-pair">ETH</span></div>
          <div class="record-time">2026-07-30 16:02</div>
        </div>
        <div class="record-item">
          <div><span class="exchange-pair">USDT</span><svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19M19 12L12 5M19 12L12 19"/></svg><span class="exchange-pair">SOL</span></div>
          <div class="record-time">2026-07-28 10:44</div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-overlay" id="toastBox"></div>

  <script>
    function toast(type, msg) {
      var box = document.getElementById('toastBox');
      var el = document.createElement('div');
      el.className = 'toast-message toast-' + type;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(function () { el.remove(); }, 2000);
    }

    // No fee is applied here. The spread lives in the database
    // (exchange_coins.p_spread_bps, default 0) so it is charged inside the same
    // transaction as the swap and cannot be skipped by editing the page. A fee
    // constant in this file used to subtract 0.1% from the displayed figure
    // while the server charged nothing, so the number shown and the number
    // applied were different by construction.

    var uid = TrustApp.getUserId();

    // The DB session restore is async: getUserId() is null until it resolves,
    // so we must re-derive the identity on every read instead of taking the
    // boot-time snapshot (otherwise balances belong to the wrong account).
    function refreshUid() {
      var n = TrustApp.getUserId();
      if (n !== uid) {
        uid = n;
        updateBals();
        renderHist();
      }
      return uid;
    }

    function allCoins() {
      // Whatever the server prices, and never a hardcoded list: a coin the
      // platform cannot price must not be offered as swappable.
      var list = coins();
      if (!list.length) return ['USDT'];
      if (list.indexOf('USDT') === -1) list.unshift('USDT');
      return list;
    }

    // ---------------------------------------------------------------------
    //  Prices come from the server, and the server decides the rate.
    //
    //  This page used to fetch Binance in the browser and divide two numbers to
    //  show a rate. That is fine for a quote and fatal for a swap: the rate that
    //  decided the fill has to be the one the server also used, or the member is
    //  shown a number that was never applied to their money. So the page reads
    //  public.prices - the same rows exchange_coins reads - and shows the server's
    //  price, with its age. A price past the limit is shown as stale and cannot
    //  be swapped, because the function would refuse it anyway.
    //
    //  scripts/prices.mjs keeps those rows current. If it stops, nothing here
    //  invents a price; the swaps stop too, by name.
    // ---------------------------------------------------------------------
    var PRICES = {};
    var MAX_AGE_SEC = 300;

    function priceOf(sym) { return PRICES[sym] || null; }

    // The coins the platform can actually hold and price: whatever the server has
    // a live price for. Not a hardcoded list, so adding a coin is a price-feed
    // change rather than a code change, and a coin that cannot be priced never
    // appears to be swappable.
    function coins() {
      return Object.keys(PRICES).filter(function (s) { return s !== 'USDT' || true; }).sort();
    }

    function fmtAge(sec) {
      if (sec == null) return '';
      if (sec < 60) return sec + 's ago';
      if (sec < 3600) return Math.round(sec / 60) + 'm ago';
      return Math.round(sec / 3600) + 'h ago';
    }

    function loadPrices() {
      if (!window.DB || !DB.getExchangePrices) return Promise.resolve(false);
      return DB.getExchangePrices().then(function (map) {
        PRICES = map || {};
        return true;
      }).catch(function () { return false; });
    }

    function rateOf(sym) {
      if (sym === 'USDT') return 1;              // seeded at exactly 1, never fetched
      var p = priceOf(sym);
      return p && p.price > 0 ? p.price : 0;
    }

    function buildOptions(selected) {
      return allCoins().map(function (s) {
        return '<option value="' + s + '"' + (s === selected ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
    }

    function fmtAmt(n, coin) {
      var dec = (coin === 'BTC' || coin === 'ETH') ? 4 : 2;
      return (parseFloat(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function updateBals() {
      refreshUid();
      var f = document.getElementById('fromCoin').value;
      var t = document.getElementById('toCoin').value;
      var elF = document.getElementById('fromBal');
      var elT = document.getElementById('toBal');
      var elT2 = document.getElementById('toBalCoin');
      if (elF) elF.textContent = fmtAmt(TrustApp.getBalance(uid, f), f);
      if (elT) elT.textContent = fmtAmt(TrustApp.getBalance(uid, t), t);
      if (elT2) elT2.textContent = t;
    }

    function calc() {
      var fromSel = document.getElementById('fromCoin'), toSel = document.getElementById('toCoin');
      var amt = parseFloat(document.getElementById('fromAmount').value) || 0;
      var f = fromSel.value, t = toSel.value;
      var fromR = rateOf(f), toR = rateOf(t);
      var out = document.getElementById('toAmount');
      var line = document.getElementById('rateLine');
      var stale = [];

      if (!fromR || !toR) {
        out.value = '';
        line.textContent = 'Live price unavailable for ' + (!fromR ? f : t) + '. No coins were moved.';
        return;
      }

      // Same arithmetic the server does, so the figure on screen is the figure
      // that will be credited. The server rounds to 8dp; matching that here means
      // the two never disagree by a rounding step.
      var recv = Math.round(amt * fromR / toR * 1e8) / 1e8;
      out.value = recv === 0 ? '' : recv;

      if (PRICES[f] && !PRICES[f].tradable) stale.push(f);
      if (PRICES[t] && !PRICES[t].tradable) stale.push(t);

      var rateTxt = '1 ' + f + ' = ' + (fromR / toR).toFixed(8) + ' ' + t;
      if (stale.length) {
        rateTxt += '  (price ' + fmtAge(PRICES[stale[0]].ageSec) + ' - too old to swap)';
      } else if (PRICES[f] && PRICES[f].ageSec != null) {
        rateTxt += '  (server price, updated ' + fmtAge(PRICES[f].ageSec) + ')';
      }
      line.textContent = rateTxt;
    }

    function setMax() {
      document.getElementById('fromAmount').value = parseFloat(document.getElementById('fromBal').textContent.replace(/,/g, ''));
      calc();
    }

    function getExchanges() {
      // Read from the ledger, which the function wrote: both legs, with the rate
      // in the note. The old version parsed a transaction description string,
      // which is why it could not tell a real swap from anything else.
      refreshUid();
      try {
        var rows = TrustDB.getExchangeHistory ? TrustDB.getExchangeHistory() : [];
        var out = [];
        var byPair = {};
        rows.forEach(function (r) {
          var d = parseFloat(r.delta) || 0;
          // The debit leg is the one the note describes as the coin being sold.
          var m = /exchange ([-\d.]+) (\S+) -> ([-\d.]+) (\S+) at/.exec(r.note || '');
          if (!m) return;
          var entry = {
            at: r.created_at,
            from: m[2], fromAmount: parseFloat(m[1]),
            to: m[4], toAmount: parseFloat(m[3])
          };
          // Each swap wrote two rows with the same note; keep one of the pair.
          var key = r.created_at + '|' + entry.from;
          if (byPair[key]) return;
          byPair[key] = true;
          out.push(entry);
        });
        return out;
      } catch (e) { return []; }
    }

    function renderHist() {
      var list = getExchanges();
      var box = document.getElementById('histList');
      if (!box) return;
      if (!list.length) { box.innerHTML = '<div class="empty-text" style="padding:20px 0;text-align:center;color:#999;font-size:13px;">' + TrustApp.t('exch.noYet') + '</div>'; return; }
      box.innerHTML = list.slice().reverse().map(function (e) {
        var arrow = '<svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19M19 12L12 5M19 12L12 19"/></svg>';
        return '<div class="record-item"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">'
          + '<span class="exchange-pair">' + fmtAmt(e.fromAmount, e.from) + ' ' + e.from + '</span>' + arrow
          + '<span class="exchange-pair">' + fmtAmt(e.toAmount, e.to) + ' ' + e.to + '</span></div>'
          + '<div class="record-time">' + (e.at || '').replace('T', ' ').slice(0, 16) + '</div></div>';
      }).join('');
    }

    // A swap moves two balances at once, so it cannot be done from the browser:
    // two independent writes with no transaction around them can half-apply, and
    // the member is left with neither coin. exchange_coins does both legs in one
    // transaction, at the server's own price, and refuses rather than guessing.
    //
    // Nothing about the rate is sent. There is no parameter to put it in.
    function doExchange() {
      refreshUid();
      if (!uid) { toast('error', 'Please sign in first'); return; }
      var amt = parseFloat(document.getElementById('fromAmount').value) || 0;
      var f = document.getElementById('fromCoin').value, t = document.getElementById('toCoin').value;
      if (amt <= 0) { toast('error', 'Enter an amount'); return; }
      if (f === t) { toast('error', 'Choose two different coins'); return; }

      // Do not send something the server will refuse. Checking here is a
      // courtesy, not a control: the function re-checks all of it.
      var pf = priceOf(f), pt = priceOf(t);
      if (!pf || !pt) { toast('error', 'Live price unavailable. No coins were moved.'); return; }
      if (!pf.tradable || !pt.tradable) {
        toast('error', 'The price for ' + (!pf.tradable ? f : t) + ' is ' + fmtAge((!pf.tradable ? pf : pt).ageSec) + ', which is too old to trade at. No coins were moved.');
        return;
      }

      var btn = document.getElementById('exchangeBtn');
      var label = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Exchanging...'; }

      DB.exchangeCoins(f, amt, t).then(function (res) {
        if (!res || res.ok !== true) throw new Error((res && res.error) || 'The exchange did not go through.');
        // The server's figures, not the ones typed above. If the price moved
        // between the quote and the fill, the member sees what they actually
        // got rather than what they were shown.
        document.getElementById('toAmount').value = res.amount_out;
        toast('success', 'Exchanged ' + res.amount_in + ' ' + res.coin_in + ' for ' + res.amount_out + ' ' + res.coin_out);
        document.getElementById('fromAmount').value = '';
        document.getElementById('fromAmount').dispatchEvent(new Event('input', { bubbles: true }));
        if (TrustApp.refreshBalances) TrustApp.refreshBalances();
        return loadPrices().then(function () { updateBals(); renderHist(); calc(); });
      }).catch(function (e) {
        toast('error', (e && e.message) || 'The exchange failed. No coins were moved.');
      }).then(function () {
        if (btn) { btn.disabled = false; btn.textContent = label || 'Exchange'; }
      });
    }

    function fillCoinOptions() {
      var list = allCoins();
      var f = document.getElementById('fromCoin'), t = document.getElementById('toCoin');
      var keepF = f.value, keepT = t.value;
      f.innerHTML = buildOptions(list.indexOf(keepF) !== -1 ? keepF : 'USDT');
      t.innerHTML = buildOptions(list.indexOf(keepT) !== -1 && keepT !== f.value ? keepT : (list.filter(function (c) { return c !== f.value; })[0] || 'USDT'));
    }

    function refreshPrices() {
      return loadPrices().then(function () {
        fillCoinOptions();
        updateBals();
        calc();
        renderHist();
      });
    }

    document.getElementById('fromAmount').addEventListener('input', calc);
    document.getElementById('fromCoin').onchange = function () { fillCoinOptions(); updateBals(); calc(); };
    document.getElementById('toCoin').onchange = function () { updateBals(); calc(); };
    window.addEventListener('storage', function (e) {
      if (e.key === 'trustBalances' || e.key === null) updateBals();
    });
    window.addEventListener('trustsync:user_balances', function () { updateBals(); });
    window.addEventListener('trustsync:transactions', function () { renderHist(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { updateBals(); refreshPrices(); }
    });
    setInterval(function () { updateBals(); renderHist(); }, 3000);
    // The server's price, refreshed on the same cadence the freshness limit
    // assumes. Twenty seconds is well inside the five-minute window, so a tab
    // left open does not drift into a price the exchange would refuse.
    setInterval(refreshPrices, 20000);
    // The real identity only appears after the async session restore; refresh
    // the balance + history the moment it lands so we never show another
    // account's (or zero) balances.
    if (TrustApp.restoreSession) TrustApp.restoreSession().then(function () { refreshUid(); });
    if (window.DB && DB.onReady) DB.onReady(function () { refreshUid(); });
    // Balances render immediately; the coin list cannot be built until the
    // server's prices arrive, so the first paint shows the form with no options
    // and fills in once loadPrices resolves.
    updateBals();
    renderHist();
    refreshPrices();
  </script>
</body>
</html>
